<!DOCTYPE html>
<html lang="en" dir="ltr" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZLYXO.com | The Pinnacle of Modern Branding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&family=Cairo:wght@400;700;900&display=swap');
        
        :root {
            --bg: #050505;
            --card: #0f0f0f;
            --accent: #ffffff;
            --text-dim: #a1a1aa;
        }

        body { 
            background-color: var(--bg); 
            color: #ffffff; 
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        
        .en { font-family: 'Plus Jakarta Sans', sans-serif; }
        .ar { font-family: 'Cairo', sans-serif; }

        /* تدرج خلفية ناعم جداً للجوال */
        .bg-glow {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, #1a1a1a 0%, transparent 80%);
            z-index: -1;
        }

        .glass-card {
            background: var(--card);
            border: 1px solid #1f1f1f;
        }

        /* تحسين استجابة العناوين */
        .main-title {
            font-size: clamp(3.5rem, 15vw, 8rem);
            line-height: 1;
            letter-spacing: -0.05em;
        }

        .lang-btn { 
            padding: 6px 16px; border-radius: 4px; cursor: pointer; 
            font-size: 10px; font-weight: 800; transition: 0.3s; 
            border: 1px solid #222;
        }
        .lang-btn.active { background: #fff; color: #000; border-color: #fff; }

        /* الأزرار مستجيبة للمس */
        .btn-action {
            width: 100%;
            padding: 1rem;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: 0.3s;
            display: block;
            text-align: center;
        }
    </style>
</head>
<body class="en min-h-screen">
    <div class="bg-glow"></div>

    <nav class="w-full max-w-7xl mx-auto px-5 py-6 flex justify-between items-center relative z-50">

        <div class="flex gap-1.5 bg-white/5 p-1 rounded-md border border-white/10">

            <div id="btn-ar" onclick="setLang('ar')" class="lang-btn">AR</div>
        </div>
    </nav>

    <main class="w-full max-w-6xl mx-auto px-5 pt-8 md:pt-16 text-center relative z-10">
        <div class="inline-block px-3 py-1 border border-white/10 bg-white/5 text-[9px] font-bold tracking-[3px] uppercase mb-6 text-white/50">
            Certified Asset
        </div>
        
        <h1 class="main-title font-black mb-4 italic uppercase">ZLYXO</h1>
        <p class="text-base md:text-2xl text-zinc-500 font-light mb-12 italic tracking-wide px-4" id="hero-sub">The Pinnacle of Modern Branding</p>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 mb-20">
            <div class="glass-card p-8 rounded-xl flex flex-col justify-between order-2 md:order-1">

                    <span class="text-[9px] font-bold text-zinc-600 uppercase tracking-widest block mb-2">Direct Purchase</span>
                    <div class="text-4xl font-bold italic">$2,300</div>
                </div>
                <a href="https://unstoppabledomains.com/d/zlyxo.com" target="_blank" class="btn-action bg-white text-black hover:bg-zinc-200">Buy Now</a>
            </div>

            <div class="glass-card p-8 rounded-xl border-white/30 bg-white/[0.03] flex flex-col justify-between order-1 md:order-2 md:scale-105 shadow-2xl">
                <div class="mb-6 text-left md:text-center">
                    <span class="text-[9px] font-bold text-white uppercase tracking-widest block mb-2">Lease-to-Own</span>
                    <div class="text-4xl font-bold italic">$153.34<span class="text-sm font-normal opacity-40">/mo</span></div>
                    <p class="text-[9px] text-zinc-400 font-bold mt-2 uppercase italic tracking-tighter" id="d-lease-note">* 20% Down Payment Required</p>
                </div>
                <a href="https://unstoppabledomains.com/d/zlyxo.com" target="_blank" class="btn-action bg-white text-black hover:bg-zinc-200">Secure Domain</a>
            </div>

            <div class="glass-card p-8 rounded-xl flex flex-col justify-between order-3 md:order-3">
                <div class="mb-6">
                    <span class="text-[9px] font-bold text-zinc-600 uppercase tracking-widest block mb-2">Negotiations</span>
                    <div class="text-2xl font-bold italic uppercase">Custom Offer</div>
                </div>
                <a href="mailto:domainssellerking@gmail.com?subject=Offer for ZLYXO.com" class="btn-action border border-zinc-800 text-white hover:bg-white hover:text-black">Contact</a>
            </div>
        </div>

        <div id="full-content" class="w-full max-w-4xl mx-auto pb-24 text-left px-2">
            </div>
    </main>

    <script>
        const content = {
            en: {
                hero_sub: "The Pinnacle of Modern Branding",
                dir: "ltr", align: "text-left",
                lease_note: "* 20% Down Payment + Installments",
                body: `
                    <div class="space-y-12">
                        <section><p class="text-lg md:text-xl text-zinc-400 leading-relaxed font-light">Unlock a world of limitless potential with <strong class="text-white">ZLYXO.com</strong>, a premier 5-letter domain that embodies the essence of prestige and innovation. ZLYXO stands as a masterpiece of linguistic and visual engineering—bold and unforgettable.</p></section>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="space-y-2"><h3 class="text-white font-bold uppercase tracking-widest text-xs">Linguistic Magnetism</h3><p class="text-zinc-500 text-sm leading-relaxed text-justify">ZLYXO is a rare phonetic gem. It begins with 'Z' and concludes with 'O', creating a "loop of memorability" that ensures your brand stays at the forefront.</p></div>
                            <div class="space-y-2"><h3 class="text-white font-bold uppercase tracking-widest text-xs">Power-Letter Signature</h3><p class="text-zinc-500 text-sm leading-relaxed text-justify">Integrating ‘Z’ and ‘X’ instantly signals authority, cutting-edge intelligence, and a futuristic mindset.</p></div>
                            <div class="space-y-2"><h3 class="text-white font-bold uppercase tracking-widest text-xs">A Universal Canvas</h3><p class="text-zinc-500 text-sm leading-relaxed text-justify">A "Chameleon Brand" perfectly neutral yet incredibly powerful for tech, luxury, or finance giants.</p></div>
                            <div class="space-y-2"><h3 class="text-white font-bold uppercase tracking-widest text-xs">Visual Symmetry</h3><p class="text-zinc-500 text-sm leading-relaxed text-justify">With its balanced 5-letter structure, ZLYXO scales perfectly from small screens to massive billboards.</p></div>
                        </div>

                        <div class="p-8 border border-white/5 bg-white/[0.02] rounded-lg">
                            <h2 class="text-xl font-bold text-white mb-2 uppercase italic">Digital Authority</h2>
                            <p class="text-zinc-500 text-sm leading-relaxed">The .com extension remains the undisputed king. Owning ZLYXO.com grants immediate "legacy status" and premium SEO advantages.</p>
                        </div>

                        <div class="pt-8 border-t border-white/5">
                            <h3 class="text-2xl font-black text-white uppercase italic tracking-tighter mb-4">Strategic Advantage</h3>
                            <p class="text-zinc-500 leading-relaxed text-base italic">ZLYXO.com is not merely a digital address; it is a high-yield investment and a definitive statement of intent.</p>
                        </div>
                    </div>
                `
            },
            ar: {
                hero_sub: "قمة العلامات التجارية الحديثة",
                dir: "rtl", align: "text-right",
                lease_note: "* يتطلب 20% دفعة مقدمة + أقساط",
                body: `
                    <div class="space-y-12">
                        <section><p class="text-lg md:text-xl text-zinc-400 leading-relaxed font-light">أطلق العنان لإمكانات لا حدود لها مع <strong class="text-white">ZLYXO.com</strong>، النطاق المتميز الذي يجسد جوهر الهيبة والابتكار. يقف ZLYXO كتحفة هندسية لغوية وبصرية - جريئة ولا تُنسى.</p></section>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="space-y-2"><h3 class="text-white font-bold uppercase tracking-widest text-xs">المغناطيسية اللغوية</h3><p class="text-zinc-500 text-sm leading-relaxed">ZLYXO جوهرة صوتية نادرة، تبدأ بحرف ‘Z’ وتنتهي بحرف ‘O’، مما يخلق حلقة ذاكرة تضمن بقاءك في المقدمة.</p></div>
                            <div class="space-y-2"><h3 class="text-white font-bold uppercase tracking-widest text-xs">توقيع الأحرف القوية</h3><p class="text-zinc-500 text-sm leading-relaxed">دمج حرفي ‘Z’ و ‘X’ يشير فوراً إلى السلطة والذكاء المتطور والعقلية المستقبلية.</p></div>
                            <div class="space-y-2"><h3 class="text-white font-bold uppercase tracking-widest text-xs">لوحة عالمية</h3><p class="text-zinc-500 text-sm leading-relaxed">براند كالحرباء، قوي ومحايد، مثالي لعمالقة التكنولوجيا أو دور الأزياء الفاخرة.</p></div>
                            <div class="space-y-2"><h3 class="text-white font-bold uppercase tracking-widest text-xs">التناظر البصري</h3><p class="text-zinc-500 text-sm leading-relaxed">هيكل مدمج من 5 أحرف، يتوسع بجمالية من شاشات الجوال الصغيرة إلى اللوحات الضخمة.</p></div>
                        </div>

                        <div class="p-8 border border-white/5 bg-white/[0.02] rounded-lg">
                            <h2 class="text-xl font-bold text-white mb-2 uppercase italic">السلطة الرقمية المطلقة</h2>
                            <p class="text-zinc-500 text-sm leading-relaxed">يبقى امتداد .com هو الملك، وامتلاك ZLYXO.com يمنحك مكانة فورية وثقة عالمية.</p>
                        </div>

                        <div class="pt-8 border-t border-white/5">
                            <h3 class="text-2xl font-black text-white uppercase italic tracking-tighter mb-4">الميزة الاستراتيجية</h3>
                            <p class="text-zinc-500 leading-relaxed text-base italic">ZLYXO.com ليس مجرد عنوان؛ إنه استثمار عالي القيمة وبيان صريح للريادة.</p>
                        </div>
                    </div>
                `
            }
        };

        function setLang(lang) {
            const d = content[lang];
            document.getElementById('mainHtml').dir = d.dir;
            document.body.className = lang + " min-h-screen";
            document.getElementById('hero-sub').innerText = d.hero_sub;
            document.getElementById('d-lease-note').innerText = d.lease_note;
            const fullContent = document.getElementById('full-content');
            fullContent.innerHTML = d.body;
            fullContent.className = `w-full max-w-4xl mx-auto pb-24 ${d.align} px-2`;
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
        }

        setLang('en');
    </script>
</body>
</html>
