<!DOCTYPE html>
<html lang="en" dir="ltr" id="mainHtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZLYXO.com | The Pinnacle of Modern Branding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&family=Cairo:wght@400;700;900&family=Orbitron:wght@900&display=swap');
        
        :root {
            --bg: #d1d5db; 
            --frame-bg: #e2e2e2;
            --card: rgba(255, 255, 255, 0.4);
            --text-main: #0a0a0a;
            --text-dim: #71717a;
            --border: rgba(0,0,0,0.1);
            --stroke: rgba(0,0,0,0.08);
        }

        .dark-mode {
            --bg: #050505;
            --frame-bg: #0f0f0f;
            --card: rgba(255, 255, 255, 0.03);
            --text-main: #ffffff;
            --text-dim: #a1a1aa;
            --border: rgba(255,255,255,0.1);
            --stroke: rgba(255,255,255,0.05);
        }

        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            transition: background 0.4s ease, color 0.4s ease;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        .en { font-family: 'Plus Jakarta Sans', sans-serif; }
        .ar { font-family: 'Cairo', sans-serif; }

        .site-frame {
            width: 95%;
            max-width: 1400px;
            margin: 2.5vh auto;
            min-height: 95vh;
            background: var(--frame-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 20px 20px 60px rgba(0,0,0,0.05);
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
            transition: background 0.4s ease;
        }

        .bg-title {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(5rem, 25vw, 15rem);
            font-weight: 900;
            color: transparent;
            -webkit-text-stroke: 1px var(--stroke);
            z-index: 0;
            pointer-events: none;
            letter-spacing: -0.05em;
            text-transform: uppercase;
        }

        .glass-card {
            background: var(--card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            transform: translateY(40px);
        }

        .card-1 { animation: slideUp 0.8s 0.4s forwards; }
        .card-2 { animation: slideUp 0.8s 0.6s forwards; }
        .card-3 { animation: slideUp 0.8s 0.8s forwards; }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .nav-btn { 
            padding: 6px 14px; border-radius: 6px; cursor: pointer; 
            font-size: 11px; font-weight: 800; transition: 0.3s; 
            border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
        }
        .nav-btn.active { background: var(--text-main); color: var(--frame-bg); }

        .btn-action {
            width: 100%; padding: 1.1rem; font-size: 11px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 2px; transition: 0.4s;
            display: block; text-align: center; border-radius: 10px;
            background: var(--text-main); color: var(--frame-bg);
        }

        /* تأثير قلب ألوان الصورة جاهز مسبقاً */
        .dark-mode #logo-img {
            filter: invert(1) brightness(2);
        }
        #logo-img {
            transition: all 0.4s ease;
        }
    </style>
</head>
<body class="en">

    <div class="site-frame">
        <div class="bg-title" id="bg-text">ZLYXO</div>

        <nav class="w-full px-8 py-8 flex justify-between items-center relative z-50">
            <div class="text-2xl font-black italic tracking-tighter" style="font-family: 'Orbitron';">ZLYXO<span class="opacity-30">.com</span></div>
            
            <div class="flex gap-2 items-center">
                <div class="flex gap-1 bg-black/5 p-1 rounded-lg border border-black/5">
                    <div id="btn-en" onclick="setLang('en')" class="nav-btn active">EN</div>
                    <div id="btn-ar" onclick="setLang('ar')" class="nav-btn">AR</div>
                </div>
                <div onclick="toggleDark()" class="nav-btn bg-black/5"><i id="mode-icon" class="fas fa-moon"></i></div>
            </div>
        </nav>

        <main class="w-full max-w-6xl mx-auto px-5 pt-12 text-center relative z-10">
            <div class="inline-block px-4 py-1 border border-black/10 bg-black/5 text-[10px] font-black tracking-[4px] uppercase mb-8 opacity-50">Certified Asset</div>
            
            <div class="flex justify-center mb-6">
                <img id="logo-img" src="43959.png" alt="ZLYXO" style="max-width: 400px; width: 85%; height: auto;">
            </div>

            <p class="text-lg md:text-2xl var(--text-dim) font-bold mb-16 italic tracking-widest uppercase opacity-80" id="hero-sub">The Pinnacle of Modern Branding</p>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-24">
                <div class="glass-card card-1 p-10 rounded-2xl flex flex-col justify-between">
                    <div>
                        <span class="text-[10px] font-black opacity-40 uppercase tracking-widest block mb-3">Direct Purchase</span>
                        <div class="text-5xl font-black italic">$2,300</div>
                    </div>
                    <a href="https://unstoppabledomains.com/d/zlyxo.com" target="_blank" class="btn-action mt-8">Buy Now</a>
                </div>

                <div class="glass-card card-2 p-10 rounded-2xl border-white/10 flex flex-col justify-between md:scale-105 shadow-xl">
                    <div>
                        <span class="text-[10px] font-black uppercase tracking-widest block mb-3">Lease-to-Own</span>
                        <div class="text-5xl font-black italic">$153.34<span class="text-sm font-normal opacity-40">/mo</span></div>
                        <p class="text-[9px] opacity-50 font-bold mt-4 uppercase italic" id="d-lease-note">* 20% Down Payment Required</p>
                    </div>
                    <a href="https://unstoppabledomains.com/d/zlyxo.com" target="_blank" class="btn-action mt-8">Secure Domain</a>
                </div>

                <div class="glass-card card-3 p-10 rounded-2xl flex flex-col justify-between">
                    <div>
                        <span class="text-[10px] font-black opacity-40 uppercase tracking-widest block mb-3">Negotiations</span>
                        <div class="text-2xl font-black italic uppercase">Custom Offer</div>
                    </div>
                    <a href="mailto:domainssellerking@gmail.com?subject=Offer for ZLYXO.com" class="btn-action mt-8 border-2 border-current bg-transparent !text-current">Contact</a>
                </div>
            </div>

            <div id="full-content" class="w-full max-w-4xl mx-auto pb-32"></div>
        </main>
    </div>

    <script>
        const content = {
            en: {
                hero_sub: "The Pinnacle of Modern Branding",
                dir: "ltr", align: "text-left",
                lease_note: "* 20% Down Payment + Installments",
                body: `
                    <div class="space-y-12">
                        <section><p class="text-lg md:text-xl text-zinc-500 leading-relaxed font-medium">Unlock a world of limitless potential with <strong class="text-current font-black">ZLYXO.com</strong>, a premier 5-letter domain that embodies the essence of prestige and innovation. ZLYXO stands as a masterpiece of linguistic and visual engineering—bold and unforgettable.</p></section>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="space-y-2 border-l-2 border-current pl-6"><h3 class="font-bold uppercase tracking-widest text-xs">Linguistic Magnetism</h3><p class="text-zinc-500 text-sm leading-relaxed">ZLYXO is a rare phonetic gem. It begins with 'Z' and concludes with 'O', creating a "loop of memorability" that ensures your brand stays at the forefront.</p></div>
                            <div class="space-y-2 border-l-2 border-current pl-6"><h3 class="font-bold uppercase tracking-widest text-xs">Power-Letter Signature</h3><p class="text-zinc-500 text-sm leading-relaxed">Integrating ‘Z’ and ‘X’ instantly signals authority, cutting-edge intelligence, and a futuristic mindset.</p></div>
                            <div class="space-y-2 border-l-2 border-current pl-6"><h3 class="font-bold uppercase tracking-widest text-xs">A Universal Canvas</h3><p class="text-zinc-500 text-sm leading-relaxed">A "Chameleon Brand" perfectly neutral yet incredibly powerful for tech, luxury, or finance giants.</p></div>
                            <div class="space-y-2 border-l-2 border-current pl-6"><h3 class="font-bold uppercase tracking-widest text-xs">Visual Symmetry</h3><p class="text-zinc-500 text-sm leading-relaxed">With its balanced 5-letter structure, ZLYXO scales perfectly from small screens to massive billboards.</p></div>
                        </div>
                    </div>`
            },
            ar: {
                hero_sub: "قمة العلامات التجارية الحديثة",
                dir: "rtl", align: "text-right",
                lease_note: "* يتطلب 20% دفعة مقدمة + أقساط",
                body: `
                    <div class="space-y-12">
                        <section><p class="text-lg md:text-xl text-zinc-500 leading-relaxed font-medium">أطلق العنان لإمكانات لا حدود لها مع <strong class="text-current font-black">ZLYXO.com</strong>، النطاق المتميز الذي يجسد جوهر الهيبة والابتكار. يقف ZLYXO كتحفة هندسية لغوية وبصرية - جريئة ولا تُنسى.</p></section>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                            <div class="space-y-2 border-r-2 border-current pr-6"><h3 class="font-bold uppercase tracking-widest text-xs">المغناطيسية اللغوية</h3><p class="text-zinc-500 text-sm leading-relaxed">ZLYXO جوهرة صوتية نادرة، تبدأ بحرف ‘Z’ وتنتهي بحرف ‘O’، مما يخلق حلقة ذاكرة تضمن بقاءك في المقدمة.</p></div>
                            <div class="space-y-2 border-r-2 border-current pr-6"><h3 class="font-bold uppercase tracking-widest text-xs">توقيع الأحرف القوية</h3><p class="text-zinc-500 text-sm leading-relaxed">دمج حرفي ‘Z’ و ‘X’ يشير فوراً إلى السلطة والذكاء المتطور والعقلية المستقبلية.</p></div>
                            <div class="space-y-2 border-r-2 border-current pr-6"><h3 class="font-bold uppercase tracking-widest text-xs">لوحة عالمية</h3><p class="text-zinc-500 text-sm leading-relaxed">براند كالحرباء، قوي ومحايد، مثالي لعمالقة التكنولوجيا أو دور الأزياء الفاخرة.</p></div>
                            <div class="space-y-2 border-r-2 border-current pr-6"><h3 class="font-bold uppercase tracking-widest text-xs">التناظر البصري</h3><p class="text-zinc-500 text-sm leading-relaxed">هيكل مدمج من 5 أحرف، يتوسع بجمالية من شاشات الجوال الصغيرة إلى اللوحات الضخمة.</p></div>
                        </div>
                    </div>`
            }
        };

        function toggleDark() {
            document.body.classList.toggle('dark-mode');
            document.getElementById('mode-icon').className = document.body.classList.contains('dark-mode') ? 'fas fa-sun' : 'fas fa-moon';
        }

        function setLang(lang) {
            const d = content[lang];
            document.getElementById('mainHtml').dir = d.dir;
            document.body.className = lang + (document.body.classList.contains('dark-mode') ? ' dark-mode' : '');
            document.getElementById('hero-sub').innerText = d.hero_sub;
            document.getElementById('d-lease-note').innerText = d.lease_note;
            const fc = document.getElementById('full-content');
            fc.innerHTML = d.body;
            fc.className = `w-full max-w-4xl mx-auto pb-32 ${d.align} px-2`;
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');
            document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');
        }
        
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX - window.innerWidth/2) * 0.01;
            const y = (e.clientY - window.innerHeight/2) * 0.01;
            const bgText = document.getElementById('bg-text');
            if(bgText) bgText.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
        });

        setLang('en');
    </script>
</body>
</html>
